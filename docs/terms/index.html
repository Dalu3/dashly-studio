        <!--
            Weight 300 dropped: nothing in the codebase references
            --font-weight-light (grepped across src/**/*.css|jsx|tsx), so it
            was pure unused payload on every load.

            Loaded as non-render-blocking: `media="print"` makes the browser
            fetch it without waiting for it before first paint, then the
            `onload` swap applies it once it has arrived. `<noscript>` keeps
            the normal blocking behaviour for the rare case JS is disabled,
            so the fonts still load either way.
        -->
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Sora:wght@200;400;500;600;700&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Sora:wght@200;400;500;600;700&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Sora:wght@200;400;500;600;700&display=swap"
            />
        </noscript>
        <!--
            Starts the hello.glb fetch as soon as the browser parses <head>,
            instead of waiting for the JS module chain (App.jsx's dynamic
            import -> preloadHello.ts -> GLTFLoader.load) to kick it off.
            `as="fetch"` + `crossorigin` match how GLTFLoader actually
            requests it (via fetch), which is required for the preload to be
            reused rather than triggering a second request.
        -->
        <link
            rel="preload"
            href="/models/hello.glb"
            as="fetch"
            type="model/gltf-binary"
            crossorigin
        />
